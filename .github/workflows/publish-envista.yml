name: Publish Envista

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-envista.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct project
        run: node .envista-upload/assemble.mjs
      - name: Apply latest UI polish
        run: |
          cat >> app/globals.css <<'EOF'

          /* --- Envista UI polish: Social composer, team header and project cards --- */
          .composer{
            padding:18px;
            border-radius:16px;
            background:linear-gradient(180deg,rgba(28,42,61,.98),rgba(22,34,50,.98));
          }
          .composer-head{
            display:flex;
            align-items:center;
            gap:11px;
            margin-bottom:12px;
          }
          .composer-head select{
            width:auto;
            min-width:250px;
            max-width:360px;
            height:38px;
            border:1px solid var(--border);
            border-radius:9px;
            background:#132231;
            color:#eaf2f8;
            padding:0 34px 0 11px;
            outline:none;
            font-size:12px;
          }
          .composer-head select:focus,
          .composer textarea:focus{
            border-color:rgba(0,191,166,.5);
            box-shadow:0 0 0 3px rgba(0,191,166,.08);
          }
          .composer textarea{
            display:block;
            width:100%;
            min-height:118px;
            resize:vertical;
            border:1px solid var(--border);
            border-radius:11px;
            background:#132231;
            color:#edf4fa;
            padding:13px 14px;
            outline:none;
            font:inherit;
            font-size:13px;
            line-height:1.55;
          }
          .composer textarea::placeholder{color:#75889c}
          .composer-actions{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-top:11px;
          }
          .composer-actions .secondary,
          .composer-actions .primary{
            min-height:38px;
            border-radius:9px;
            padding:0 14px;
          }
          .team-hero{
            position:relative;
            align-items:flex-start;
            padding:20px 22px;
            gap:14px;
            border-radius:14px;
          }
          .team-hero>.avatar{
            width:38px;
            height:38px;
            flex:0 0 38px;
            font-size:12px;
          }
          .team-hero>div:nth-child(2){min-width:0;flex:1;padding-right:12px}
          .team-hero h1{margin:2px 0 7px;font-size:24px}
          .team-hero p{margin:0 0 10px;max-width:660px;font-size:12px;line-height:1.5}
          .team-hero>.actions{
            margin-left:auto;
            width:auto;
            flex:0 0 auto;
            justify-content:flex-end;
            align-items:center;
            flex-wrap:nowrap;
          }
          .team-hero>.actions button{
            min-height:38px;
            white-space:nowrap;
            padding:0 13px;
            border-radius:9px;
            font-size:11px;
          }
          .project-cover{height:96px;align-items:center;padding:13px 14px}
          .project-cover>span{font-size:32px}
          .project-cover .stage{
            padding:4px 8px;
            font-size:10px;
            line-height:1.1;
            letter-spacing:.01em;
            box-shadow:none;
          }
          .project-card .card-body{padding:13px 14px 14px}
          .project-card .card-body h3{margin:7px 0 5px}
          @media(max-width:650px){
            .composer-head select{min-width:0;width:100%;max-width:none}
            .composer-head{align-items:flex-start}
            .composer-actions{align-items:stretch}
            .team-hero>.actions{width:100%;margin-left:0;justify-content:flex-start;flex-wrap:wrap}
            .team-hero>.actions button{flex:1 1 auto}
            .team-hero>div:nth-child(2){padding-right:0}
          }
          EOF
      - name: Verify frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Clean temporary and old prototype files
        run: |
          rm -rf .envista-upload .envista2 .envista3
          rm -f index.html script.js styles.css .gitkeep
          rm -rf .github
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Envista platform"
          git push

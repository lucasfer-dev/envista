name: Publish Envista MVP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-envista.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct project
        run: node .envista-upload/assemble.mjs
      - name: Clean temporary and old prototype files
        run: |
          rm -rf .envista-upload
          rm -f index.html script.js styles.css .gitkeep
          rm -f .github/workflows/publish-envista.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Envista Next.js MVP"
          git push
